<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket System Dashboard</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.15);
            --error: #ef4444;
            --error-bg: rgba(239, 68, 68, 0.15);
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient);
            color: var(--text-main);
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 32px;
            border-radius: 24px;
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            margin-top: 0;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .card h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .count {
            font-size: 48px;
            font-weight: 800;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
            transition: all 0.3s ease;
        }

        /* Pulse live indicator badge */
        .live-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            color: var(--success);
            background: var(--success-bg);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .input-wrapper {
            position: relative;
        }

        input[type="number"] {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 16px;
            font-weight: 500;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background: rgba(15, 23, 42, 0.8);
        }

        /* Removes standard utility arrows on inputs for cleaner alignment */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        button {
            display: block;
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        button:active {
            transform: translateY(1px);
        }

        .alert {
            padding: 14px 16px;
            margin-top: 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .success {
            background: var(--success-bg);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
        }

        .error {
            background: var(--error-bg);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Ticket Booking Dashboard</h1>
    
    <div class="card">
        <div class="live-badge">
            <span class="pulse-dot"></span>LIVE
        </div>
        <h3>Available Tickets</h3>
        <div id="ticketCount" class="count">——</div>
    </div>

    <div class="form-group">
        <label for="userIdInput">Identity Verification</label>
        <div class="input-wrapper">
            <input type="number" id="userIdInput" value="1" min="1" placeholder="Enter valid User ID">
        </div>
    </div>

    <button onclick="bookTicket()">Reserve Ticket Now</button>
    <div id="statusMessage" class="alert"></div>
</div>

<script>
    const eventId = 1;

    // Fetch live data from backend
    async function updateDashboard() {
        try {
            const response = await fetch(`/api/v1/bookings/event/${eventId}`);
            const data = await response.json();
            const countEl = document.getElementById('ticketCount');
            
            // Add visual transition if number scales down under load
            if(countEl.innerText !== data.availableTickets.toString()) {
                countEl.style.transform = 'scale(1.05)';
                setTimeout(() => countEl.style.transform = 'scale(1)', 150);
            }
            countEl.innerText = data.availableTickets;
        } catch (err) {
            document.getElementById('ticketCount').innerText = "Disconnected";
        }
    }

    // Call your secure booking API endpoint
    async function bookTicket() {
        const statusDiv = document.getElementById('statusMessage');
        const userIdField = document.getElementById('userIdInput');
        
        statusDiv.style.display = 'none';
        const selectedUserId = parseInt(userIdField.value);

        if (isNaN(selectedUserId)) {
            statusDiv.className = "alert error";
            statusDiv.innerText = "Validation Failed: Please enter a valid numeric User ID.";
            statusDiv.style.display = 'block';
            return;
        }

        try {
            const response = await fetch('/api/v1/bookings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: selectedUserId, eventId: eventId })
            });

            const text = await response.text();

            if (response.ok) {
                statusDiv.className = "alert success";
                statusDiv.innerText = "Success: " + text;
            } else {
                statusDiv.className = "alert error";
                statusDiv.innerText = text;
            }
            statusDiv.style.display = 'block';
            updateDashboard();
        } catch (err) {
            statusDiv.className = "alert error";
            statusDiv.innerText = "Network Error: Could not connect to booking infrastructure.";
            statusDiv.style.display = 'block';
        }
    }

    // Initial load
    updateDashboard();
    // Live update tracking loop
    setInterval(updateDashboard, 2000);
</script>
</body>
</html>
